workflows:
  android-release:
    name: تجمّع - Android
    max_build_duration: 60
    # يبني لحاله مع كل push على main — قبل، كان لازم تضغط ▶ بإيدك
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      android_signing:
        - tajammo_keystore
      vars:
        PACKAGE_NAME: "com.azax.tajammo"
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build www from source files
        script: npm run build
      - name: Sync Capacitor
        script: |
          chmod +x node_modules/.bin/*
          npx cap sync android
      - name: Build Android release AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - ameerazax@gmail.com

  # ─────────────────────────────────────────────────────────────────────
  # iOS — يبني على ماك سحابي، يوقّع أوتوماتيك، ويرفع لـ TestFlight.
  #
  # يحتاج مرة وحدة قبل أول تشغيل (شوف الرسالة):
  #   ١) مفتاح App Store Connect API مضاف بـ Codemagic → Team settings →
  #      Integrations → App Store Connect، باسم «tajammo_asc».
  #   ٢) سجل التطبيق موجود بـ App Store Connect (Apps → + → New App)
  #      بنفس الـ Bundle ID: com.azax.tajammo
  # ─────────────────────────────────────────────────────────────────────
  ios-release:
    name: تجمّع - iOS
    max_build_duration: 90
    # iOS يبني على «تاغ» بس، مو على كل push — لأن كل بناء ينرفع
    # تلقائياً لـTestFlight، وآبل تحدد ~٢٠ رفعة باليوم (ITMS-90382).
    # لمن تريد نسخة تجريبية:  git tag v1.4  ثم  git push origin v1.4
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: tajammo_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.azax.tajammo
      vars:
        BUNDLE_ID: "com.azax.tajammo"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build www from source files
        script: npm run build
      - name: Sync Capacitor (يضيف إضافة AdMob لحزمة SPM)
        script: |
          chmod +x node_modules/.bin/*
          npx cap sync ios
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Set build number
        # رقم البناء لازم يزيد بكل رفع — نربطه برقم بناء Codemagic
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - ameerazax@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
