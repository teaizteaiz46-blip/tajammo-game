workflows:
  android-release:
    name: تجمّع - Android
    max_build_duration: 60
    environment:
      android_signing:
        - tajammo_keystore
      vars:
        PACKAGE_NAME: "com.azax.tajammo"
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Sync Capacitor
        script: |
          chmod +x node_modules/.bin/*
          npx cap sync android
      - name: Build Android release AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - ameerazax@gmail.com
