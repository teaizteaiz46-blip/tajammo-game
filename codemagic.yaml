workflows:
  android-release:
    name: تجمّع - Android
    max_build_duration: 60
    environment:
      android_signing:
        - tajammo_keystore
      vars:
        PACKAGE_NAME: "com.azax.tajammo"
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Sync web assets into www
        script: cp index.html www/index.html && cp styles.css www/styles.css && cp privacy.html www/privacy.html && rm -rf www/js && cp -r js www/js
      - name: Sync Capacitor
        script: |
          chmod +x node_modules/.bin/*
          npx cap sync android
      - name: Build Android release AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - ameerazax@gmail.com
