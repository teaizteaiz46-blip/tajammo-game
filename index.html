<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تجمّع — لعبة الفئات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F2B28;
    --bg-2:#0B211E;
    --panel:#143A35;
    --panel-2:#1B4740;
    --line: rgba(244,239,225,0.14);
    --gold:#D4A857;
    --gold-dim: rgba(212,168,87,0.35);
    --rose:#C1443A;
    --rose-dim: rgba(193,68,58,0.35);
    --ivory:#F4EFE1;
    --muted:#8FB3AC;
    --sage:#6FA287;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(212,168,87,0.10), transparent 55%),
      linear-gradient(180deg, var(--bg-2), var(--bg));
    color:var(--ivory);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:980px; margin:0 auto;}
  .display{font-family:'Changa', sans-serif;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:34px;
  }
  .brand{
    font-family:'Changa', sans-serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:1px;
    color:var(--gold);
    cursor:pointer;
    display:flex; align-items:center; gap:10px;
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gold); box-shadow:0 0 10px var(--gold);}
  .crumb{color:var(--muted); font-size:14px;}

  /* ---------- hub ---------- */
  .hero{
    text-align:center;
    padding:50px 20px 40px;
    position:relative;
  }
  .hero:before{
    content:"";
    position:absolute; inset:0 auto auto 50%;
    transform:translateX(-50%);
    top:0; width:280px; height:280px;
    background:radial-gradient(circle, rgba(212,168,87,0.18), transparent 70%);
    pointer-events:none;
  }
  .hero h1{
    font-family:'Changa', sans-serif;
    font-weight:800;
    font-size:clamp(42px,8vw,68px);
    margin:0 0 6px;
    color:var(--ivory);
    position:relative;
  }
  .hero h1 span{color:var(--gold);}
  .hero p{color:var(--muted); font-size:16px; margin:0; position:relative;}

  .bulb-row{
    display:flex; justify-content:center; gap:10px; margin:22px 0 6px; position:relative;
  }
  .bulb-row i{
    width:6px;height:6px;border-radius:50%;
    background:var(--gold-dim);
  }

  .cards{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px; margin-top:30px;
  }
  .card{
    background:linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 22px;
    cursor:pointer;
    transition:transform .18s ease, border-color .18s ease;
    text-align:right;
    position:relative;
    overflow:hidden;
  }
  .card:hover{transform:translateY(-4px); border-color:var(--gold-dim);}
  .card h3{font-family:'Changa'; font-size:21px; margin:0 0 8px; color:var(--ivory);}
  .card p{color:var(--muted); font-size:14px; margin:0; line-height:1.7;}
  .card .tag{
    display:inline-block; margin-bottom:14px;
    font-size:12px; color:var(--gold); border:1px solid var(--gold-dim);
    padding:3px 10px; border-radius:20px;
  }
  .card.soon{opacity:.5; cursor:not-allowed;}
  .card.soon:hover{transform:none; border-color:var(--line);}

  /* ---------- generic buttons ---------- */
  .btn{
    font-family:'Tajawal'; font-weight:700; font-size:15px;
    border:none; border-radius:12px; padding:13px 22px;
    cursor:pointer; transition:filter .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-gold{background:var(--gold); color:#22190A;}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--ivory); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--gold-dim);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn-sm{padding:9px 14px; font-size:13px; border-radius:9px;}
  .btn-row{display:flex; gap:12px; margin-top:26px; flex-wrap:wrap;}

  /* ---------- panels / sections ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:24px;
    margin-bottom:20px;
  }
  .section-title{
    font-family:'Changa'; font-size:19px; color:var(--gold); margin:0 0 4px;
  }
  .section-sub{color:var(--muted); font-size:13px; margin:0 0 18px;}

  label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
  input[type=text], input[type=number]{
    width:100%; background:var(--bg-2); border:1px solid var(--line);
    color:var(--ivory); border-radius:10px; padding:11px 13px;
    font-family:'Tajawal'; font-size:15px;
  }
  input[type=text]:focus, input[type=number]:focus{outline:none; border-color:var(--gold-dim);}
  select{
    background:var(--bg-2); border:1px solid var(--line); color:var(--ivory);
    border-radius:10px; padding:9px 10px; font-family:'Tajawal';
  }

  .field{margin-bottom:16px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  /* ---------- topic editor ---------- */
  .topic-block{
    border:1px solid var(--line); border-radius:14px; padding:18px;
    margin-bottom:16px; background:var(--bg-2);
  }
  .topic-block-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .topic-block-head input{font-family:'Changa'; font-size:17px; font-weight:700;}
  .q-grid{display:grid; grid-template-columns:1fr; gap:10px;}
  .q-row{
    display:grid; grid-template-columns:auto 1fr 1fr; gap:10px; align-items:center;
    padding:8px; border:1px solid var(--line); border-radius:10px;
  }
  .q-row .pts{width:88px;}
  .q-row input{font-size:13px; padding:8px 10px;}
  .remove-x{
    background:none; border:none; color:var(--rose); cursor:pointer; font-size:18px;
    line-height:1; padding:4px 8px;
  }
  .pool-counter{
    display:inline-flex; align-items:center; gap:8px; font-size:13px;
    color:var(--muted); margin-bottom:16px;
  }
  .pool-counter b{color:var(--gold);}

  /* ---------- teams / timer ---------- */
  .team-card{
    border-radius:14px; padding:18px; border:1px solid var(--line);
  }
  .team-card.t0{border-color:var(--gold-dim); background:rgba(212,168,87,0.06);}
  .team-card.t1{border-color:var(--rose-dim); background:rgba(193,68,58,0.06);}

  .toggle-row{display:flex; align-items:center; justify-content:space-between; gap:14px;}
  .switch{
    width:46px; height:26px; border-radius:20px; background:var(--bg-2);
    border:1px solid var(--line); position:relative; cursor:pointer; flex:none;
  }
  .switch.on{background:var(--gold);}
  .switch .knob{
    position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%;
    background:var(--ivory); transition:right .15s ease;
  }
  .switch.on .knob{right:22px; background:#22190A;}

  /* ---------- selection screen ---------- */
  .turn-banner{
    text-align:center; padding:16px; border-radius:14px; margin-bottom:22px;
    border:1px solid var(--gold-dim); background:rgba(212,168,87,0.08);
  }
  .turn-banner b{font-family:'Changa'; font-size:19px; color:var(--gold);}
  .pick-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px;
  }
  .pick-card{
    border:1px solid var(--line); border-radius:14px; padding:20px 14px;
    text-align:center; cursor:pointer; background:var(--panel-2);
    transition:transform .15s ease, border-color .15s ease;
    font-family:'Changa'; font-size:16px;
  }
  .pick-card:hover{transform:translateY(-3px); border-color:var(--gold-dim);}
  .pick-card.taken{opacity:.3; cursor:not-allowed;}
  .pick-card.taken:hover{transform:none;}
  .taken-by{display:block; font-family:'Tajawal'; font-size:12px; color:var(--muted); margin-top:6px;}

  /* ---------- scoreboard ---------- */
  .scoreboard{
    display:flex; gap:14px; margin-bottom:22px;
  }
  .score-card{
    flex:1; border-radius:14px; padding:16px 18px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .score-card.t0{background:linear-gradient(120deg, rgba(212,168,87,0.14), transparent); border-color:var(--gold-dim);}
  .score-card.t1{background:linear-gradient(120deg, rgba(193,68,58,0.14), transparent); border-color:var(--rose-dim);}
  .score-card .name{font-size:14px; color:var(--muted);}
  .score-card .pts{font-family:'Changa'; font-size:30px; font-weight:700;}
  .score-card.t0 .pts{color:var(--gold);}
  .score-card.t1 .pts{color:var(--rose);}

  /* ---------- board ---------- */
  .board{
    display:grid; gap:8px;
    grid-template-columns:repeat(var(--cols,6), 1fr);
  }
  .topic-head{
    font-family:'Changa'; font-size:14px; text-align:center; color:var(--ivory);
    padding:12px 6px; border-radius:10px; background:var(--panel-2);
    border:1px solid var(--line); min-height:52px; display:flex; align-items:center; justify-content:center;
  }
  .cell{
    font-family:'Changa'; font-size:20px; text-align:center; padding:18px 6px;
    border-radius:10px; background:var(--panel); border:1px solid var(--line);
    color:var(--gold); cursor:pointer; transition:transform .12s ease, background .12s ease;
  }
  .cell:hover{transform:translateY(-2px); background:var(--panel-2);}
  .cell.used{
    color:transparent; background:var(--bg-2); border-color:var(--line);
    cursor:default; box-shadow:none;
  }
  .cell.used:hover{transform:none;}
  @media (max-width:720px){
    .board{grid-template-columns:repeat(var(--cols,6), minmax(0,1fr)); gap:6px;}
    .topic-head{font-size:11px; padding:8px 3px; min-height:40px;}
    .cell{font-size:14px; padding:12px 3px;}
  }

  /* ---------- question overlay ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(6,15,14,0.86);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .q-modal{
    width:100%; max-width:640px; background:var(--panel);
    border:1px solid var(--gold-dim); border-radius:20px; padding:34px 30px;
    text-align:center; position:relative;
  }
  .q-topic{color:var(--muted); font-size:14px; margin-bottom:6px;}
  .q-points{
    font-family:'Changa'; font-size:15px; color:#22190A; background:var(--gold);
    display:inline-block; padding:4px 16px; border-radius:20px; margin-bottom:20px;
  }
  .q-text{font-size:22px; line-height:1.8; margin-bottom:22px; min-height:60px;}
  .timer{
    font-family:'Changa'; font-size:34px; color:var(--gold); margin-bottom:18px;
  }
  .timer.warn{color:var(--rose);}
  .answer-box{
    border-top:1px dashed var(--line); margin-top:20px; padding-top:20px;
  }
  .answer-box .label{color:var(--muted); font-size:13px; margin-bottom:6px;}
  .answer-box .val{font-size:19px; color:var(--sage); font-weight:700;}
  .award-row{display:flex; gap:10px; justify-content:center; margin-top:24px; flex-wrap:wrap;}

  /* ---------- end screen ---------- */
  .end-wrap{text-align:center; padding:40px 10px;}
  .end-wrap .trophy{font-size:54px; margin-bottom:10px;}
  .end-wrap h2{font-family:'Changa'; font-size:34px; margin:6px 0; color:var(--gold);}
  .end-wrap p{color:var(--muted); margin-bottom:30px;}
  .final-scores{display:flex; gap:14px; justify-content:center; margin-bottom:34px; flex-wrap:wrap;}

  .empty{
    text-align:center; color:var(--muted); padding:40px 10px; font-size:14px;
  }
</style>

<script>
/* ============================ CATEGORY QUESTION BANK (Supabase) ============================ */
/* كل موضوع فيه ٥ أسئلة سهلة (١٠٠ نقطة) و٥ أسئلة متوسطة (٢٠٠ نقطة)، محمّلة من قاعدة بيانات أونلاين.
   كل لعبة تختار عشوائياً ٢ من كل مستوى، وتتجنب تكرار نفس الأسئلة قبل ما تخلص كل الأسئلة المتوفرة. */
let CATEGORY_TOPICS = [];   // ['جغرافيا', 'تاريخ', ...] يُملى بعد التحميل
let CATEGORY_DATA = {};     // { 'جغرافيا': { easy:[{text,answer}], medium:[{text,answer}] } }
const bankUsage = {};       // { topicName: { easy:Set, medium:Set } }, in-memory rotation tracker

async function loadCategoryDatabase(){
  const { data, error } = await sb
    .from('category_questions')
    .select('topic, points, question, answer')
    .limit(2000);
  if(error) throw error;
  const grouped = {};
  data.forEach(row=>{
    if(!grouped[row.topic]) grouped[row.topic] = { easy:[], medium:[] };
    const tier = row.points <= 100 ? 'easy' : 'medium';
    grouped[row.topic][tier].push({ text:row.question, answer:row.answer });
  });
  CATEGORY_DATA = grouped;
  CATEGORY_TOPICS = Object.keys(grouped);
}

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickFromTier(tier, usedSet, n){
  let avail = tier.map((_,i)=>i).filter(i=>!usedSet.has(i));
  if(avail.length < n){ usedSet.clear(); avail = tier.map((_,i)=>i); }
  const chosen = shuffled(avail).slice(0,n);
  chosen.forEach(i=>usedSet.add(i));
  return chosen.map(i=>tier[i]);
}
function pickQuestionsForBankTopic(topicName){
  if(!bankUsage[topicName]) bankUsage[topicName] = { easy:new Set(), medium:new Set() };
  const bank = CATEGORY_DATA[topicName];
  const easyQs = pickFromTier(bank.easy, bankUsage[topicName].easy, 2);
  const medQs = pickFromTier(bank.medium, bankUsage[topicName].medium, 2);
  return [
    ...easyQs.map(q=>({ id:nextId(), text:q.text, answer:q.answer, points:100 })),
    ...medQs.map(q=>({ id:nextId(), text:q.text, answer:q.answer, points:200 }))
  ];
}

async function signUpWithEmail(email, password){
  const { error } = await sb.auth.signUp({ email, password });
  if(error) throw error;
}

async function signInWithEmail(email, password){
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) throw error;
}

function signOutUser(){
  sb.auth.signOut();
}

async function loadOrCreateProfile(authUser){
  let { data } = await sb.from('tajammo_profiles').select('*').eq('id', authUser.id).single();
  if(!data){
    const fresh = {
      id: authUser.id,
      name: authUser.user_metadata?.full_name || authUser.user_metadata?.name || (authUser.email ? authUser.email.split('@')[0] : 'لاعب'),
      email: authUser.email || '',
      avatar_url: '',
      games_played: 0,
      total_points: 0
    };
    const { data: inserted, error: insertErr } = await sb.from('tajammo_profiles').insert(fresh).select().single();
    if(insertErr){
      console.warn('تعذّر إنشاء الملف الشخصي', insertErr);
      return { uid: authUser.id, name: fresh.name, photo: '', gamesPlayed: 0, totalPoints: 0 };
    }
    data = inserted;
  }
  return {
    uid: authUser.id,
    name: data.name,
    photo: data.avatar_url,
    gamesPlayed: data.games_played,
    totalPoints: data.total_points
  };
}

async function recordGameResult(totalPoints){
  if(!state.user) return;
  const newGamesPlayed = (state.user.gamesPlayed||0) + 1;
  const newTotalPoints = (state.user.totalPoints||0) + totalPoints;
  try{
    await sb.from('tajammo_profiles').update({
      games_played: newGamesPlayed,
      total_points: newTotalPoints,
      last_played_at: new Date().toISOString()
    }).eq('id', state.user.uid);
    state.user.gamesPlayed = newGamesPlayed;
    state.user.totalPoints = newTotalPoints;
  } catch(e){ console.warn('تعذّر حفظ الإحصائيات', e); }
}

sb.auth.onAuthStateChange(async (event, session)=>{
  if(session && session.user){
    state.user = await loadOrCreateProfile(session.user);
  } else {
    state.user = null;
  }
  render();
});

/* ============================ STATE ============================ */
const state = {
  screen: 'hub',
  timerEnabled: false,
  timerSeconds: 30,
  user: null,
  statsRecordedForThisGame: false,
  showAuthModal: false,
  authMode: 'signin', // 'signin' | 'signup'
  authError: '',
  authBusy: false,
  categoryDataLoaded: false,
  categoryDataError: '',
  teams: [
    { name: 'الفريق الأول', score: 0 },
    { name: 'الفريق الثاني', score: 0 }
  ],
  pool: [],           // { id, name, bankKey|null, taken:false, takenBy:null, questions:[{id,text,answer,points}] }
  selectedTopicIds: [],
  turn: 0,
  activeCell: null,
  timerLeft: 0,
  timerHandle: null,

  // ---- من أنا؟ ----
  whoamiPlayerCount: 5,
  whoamiPlayerNames: [],
  whoamiPlayers: [],     // [{name, character, guessed:false}]
  whoamiRevealIndex: 0,
  whoamiRevealShown: false,
  whoamiTurn: 0,
  whoamiFinishOrder: [],
  whoamiTimerEnabled: false,
  whoamiTimerSeconds: 30,
  whoamiTimerLeft: 0,
  whoamiTimerHandle: null,
  whoamiLoading: false,
  whoamiError: ''
};

let uid = 1;
const nextId = () => 'id' + (uid++);

/* ============================ HELPERS ============================ */
function makeCustomTopic(name){
  return {
    id: nextId(),
    name: name,
    bankKey: null,
    taken:false, takenBy:null,
    expanded:false,
    questions:[
      { id: nextId(), text:'', answer:'', points:100 },
      { id: nextId(), text:'', answer:'', points:100 },
      { id: nextId(), text:'', answer:'', points:200 },
      { id: nextId(), text:'', answer:'', points:200 }
    ]
  };
}
function makeBankTopic(topicName){
  return {
    id: nextId(),
    name: topicName,
    bankKey: topicName,
    taken:false, takenBy:null,
    expanded:false,
    questions: pickQuestionsForBankTopic(topicName)
  };
}

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function goto(screen){ state.screen = screen; render(); window.scrollTo({top:0, behavior:'smooth'}); }

function escapeAttr(s){
  return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

/* ============================ RENDER ROOT ============================ */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderTopbar());
  let body;
  switch(state.screen){
    case 'hub': body = renderHub(); break;
    case 'cat-loading': body = renderCatLoading(); break;
    case 'editor': body = renderEditor(); break;
    case 'teams': body = renderTeams(); break;
    case 'select': body = renderSelect(); break;
    case 'board': body = renderBoard(); break;
    case 'end': body = renderEnd(); break;
    case 'whoami-setup': body = renderWhoamiSetup(); break;
    case 'whoami-reveal': body = renderWhoamiReveal(); break;
    case 'whoami-play': body = renderWhoamiPlay(); break;
    case 'whoami-end': body = renderWhoamiEnd(); break;
    default: body = renderHub();
  }
  app.appendChild(body);

  if(state.screen === 'board' && state.activeCell){
    app.appendChild(renderQuestionOverlay());
  }
  if(state.showAuthModal){
    app.appendChild(renderAuthOverlay());
  }
}

    <div class="brand"><span class="dot"></span> تجمّع</div>
    <div class="topbar-right" style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
      <div class="crumb"></div>
    </div>
  </div>`);
  bar.querySelector('.brand').addEventListener('click', ()=>{
    stopTimer();
    stopWhoamiTimer();
    goto('hub');
  });
  const crumbMap = {
    'cat-loading':'لعبة الفئات · تحميل البنك',
    editor:'لعبة الفئات · اختيار المواضيع',
    teams:'لعبة الفئات · الفرق والإعدادات',
    select:'لعبة الفئات · اختيار الفئات',
    board:'لعبة الفئات · اللعب',
    end:'لعبة الفئات · النتيجة',
    'whoami-setup':'من أنا؟ · تجهيز اللاعبين',

/* ============================ BOARD ============================ */
function renderBoard(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(renderScoreboard());

  const topics = state.selectedTopicIds.map(id => state.pool.find(t=>t.id===id));
  const board = el(`<div class="board" style="--cols:${topics.length}"></div>`);

  topics.forEach(t=>{
    board.appendChild(el(`<div class="topic-head">${escapeAttr(t.name)}</div>`));
  });

  const maxQ = Math.max(...topics.map(t=>t.questions.length));
  for(let r=0; r<maxQ; r++){
    topics.forEach(t=>{
      const q = t.questions[r];
      if(!q){ board.appendChild(el(`<div></div>`)); return; }
      const used = q.usedBy !== undefined;
      const cell = el(`<div class="cell ${used?'used':''}">${used?'':q.points}</div>`);
      if(!used){
        cell.addEventListener('click', ()=>{
          state.activeCell = { topicId:t.id, qId:q.id };
          render();
          if(state.timerEnabled && q.text.trim()) startTimer();
        });
      }
      board.appendChild(cell);
    });
  }
  wrap.appendChild(board);

  const allUsed = topics.every(t => t.questions.every(q => q.usedBy !== undefined));
  if(allUsed){
    const finishBtn = el(`<div class="btn-row"><button class="btn btn-gold" id="finish">إنهاء اللعبة وعرض النتيجة</button></div>`);
    finishBtn.querySelector('#finish').addEventListener('click', ()=> goto('end'));
    wrap.appendChild(finishBtn);
  }

  return wrap;
}

function renderScoreboard(){
  return el(`<div class="scoreboard">
    <div class="score-card t0"><span class="name">${escapeAttr(state.teams[0].name)}</span><span class="pts">${state.teams[0].score}</span></div>
    <div class="score-card t1"><span class="name">${escapeAttr(state.teams[1].name)}</span><span class="pts">${state.teams[1].score}</span></div>
  </div>`);
}

/* ============================ QUESTION OVERLAY ============================ */
function renderQuestionOverlay(){
  const { topicId, qId } = state.activeCell;
  const topic = state.pool.find(t=>t.id===topicId);
  const q = topic.questions.find(q=>q.id===qId);
  const revealed = !!q.revealed;
  const needsContent = !q.text.trim();

  const overlay = el(`<div class="overlay"></div>`);

  if(needsContent){
    const modal = el(`<div class="q-modal">
      <div class="q-topic">${escapeAttr(topic.name)}</div>
      <div class="q-points">سؤال بـ ${q.points} نقطة</div>
      <div class="field" style="text-align:right;">
        <label>اكتب السؤال الآن</label>
        <input type="text" id="live-text" placeholder="نص السؤال"/>
      </div>
      <div class="field" style="text-align:right;">
        <label>الإجابة الصحيحة (تظهر بعدين)</label>
        <input type="text" id="live-answer" placeholder="الإجابة"/>
      </div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-gold" id="live-submit">اطرح السؤال</button>
      </div>
    </div>`);
    const submit = ()=>{
      const t = modal.querySelector('#live-text').value.trim();
      const a = modal.querySelector('#live-answer').value.trim();
      if(!t) { modal.querySelector('#live-text').focus(); return; }
      q.text = t;
      q.answer = a || '—';
      render();
      if(state.timerEnabled) startTimer();
    };
    modal.querySelector('#live-submit').addEventListener('click', submit);
    overlay.appendChild(modal);
    return overlay;
  }

  const modal = el(`<div class="q-modal">
    <div class="q-topic">${escapeAttr(topic.name)}</div>
    <div class="q-points">${q.points} نقطة</div>
    <div class="q-text">${escapeAttr(q.text)}</div>
    ${state.timerEnabled ? `<div class="timer" id="timer-display">${state.timerLeft}</div>` : ''}
    ${revealed ? `
      <div class="answer-box">
        <div class="label">الإجابة</div>
        <div class="val">${escapeAttr(q.answer)}</div>
      </div>
      <div class="award-row">
        <button class="btn btn-gold btn-sm" id="award-0">نقطة لـ ${escapeAttr(state.teams[0].name)}</button>
        <button class="btn btn-sm" style="background:var(--rose); color:#fff;" id="award-1">نقطة لـ ${escapeAttr(state.teams[1].name)}</button>
        <button class="btn btn-ghost btn-sm" id="award-none">بدون إجابة صحيحة</button>
      </div>
    ` : `
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-gold" id="reveal">إظهار الإجابة</button>
      </div>
    `}
  </div>`);

  if(!revealed){
    modal.querySelector('#reveal').addEventListener('click', ()=>{
      q.revealed = true;
      stopTimer();
      render();
    });
  } else {
    modal.querySelector('#award-0').addEventListener('click', ()=> awardPoints(0, topic, q));
    modal.querySelector('#award-1').addEventListener('click', ()=> awardPoints(1, topic, q));
    modal.querySelector('#award-none').addEventListener('click', ()=> awardPoints(null, topic, q));
  }

  overlay.appendChild(modal);
  return overlay;
}

/* ============================ AUTH OVERLAY ============================ */
function renderAuthOverlay(){
  const overlay = el(`<div class="overlay"></div>`);
  const isSignup = state.authMode === 'signup';

  const modal = el(`<div class="q-modal" style="max-width:400px; text-align:right;">
    <div style="display:flex; gap:10px; justify-content:center; margin-bottom:22px;">
      <button class="btn ${!isSignup?'btn-gold':'btn-ghost'} btn-sm" id="tab-signin">دخول</button>
      <button class="btn ${isSignup?'btn-gold':'btn-ghost'} btn-sm" id="tab-signup">حساب جديد</button>
    </div>
    <div class="field">
      <label>الإيميل</label>
      <input type="text" id="auth-email" placeholder="example@email.com" dir="ltr" style="text-align:left;"/>
    </div>
    <div class="field">
      <label>الرمز السري</label>
      <input type="password" id="auth-password" placeholder="••••••••" dir="ltr" style="text-align:left;"/>
    </div>
    ${isSignup ? `<div class="field">
      <label>تأكيد الرمز السري</label>
      <input type="password" id="auth-password2" placeholder="••••••••" dir="ltr" style="text-align:left;"/>
    </div>` : ''}
    ${state.authError ? `<div style="color:var(--rose); font-size:13px; margin-bottom:14px;">${escapeAttr(state.authError)}</div>` : ''}
    <div class="btn-row" style="justify-content:center;">
      <button class="btn btn-gold" id="auth-submit" ${state.authBusy?'disabled':''}>${state.authBusy ? '...' : (isSignup ? 'إنشاء الحساب' : 'دخول')}</button>
      <button class="btn btn-ghost" id="auth-close">إلغاء</button>
    </div>
  </div>`);

  modal.querySelector('#tab-signin').addEventListener('click', ()=>{ state.authMode='signin'; state.authError=''; render(); });
  modal.querySelector('#tab-signup').addEventListener('click', ()=>{ state.authMode='signup'; state.authError=''; render(); });
  modal.querySelector('#auth-close').addEventListener('click', ()=>{ state.showAuthModal=false; state.authError=''; render(); });

  modal.querySelector('#auth-submit').addEventListener('click', async ()=>{
    const email = modal.querySelector('#auth-email').value.trim();
    const password = modal.querySelector('#auth-password').value;
    if(!email || !password){ state.authError = 'عبّي الإيميل والرمز السري.'; render(); return; }
    if(isSignup){
      const password2 = modal.querySelector('#auth-password2').value;
      if(password !== password2){ state.authError = 'الرمز السري وتأكيده غير متطابقين.'; render(); return; }
      if(password.length < 6){ state.authError = 'الرمز السري لازم يكون ٦ أحرف على الأقل.'; render(); return; }
    }
    state.authBusy = true; state.authError=''; render();
    try{
      if(isSignup){
        await signUpWithEmail(email, password);
        state.authBusy = false;
        state.authError = 'تم إنشاء الحساب. إذا يطلب تأكيد الإيميل، تحقق من صندوق بريدك، وإلا رجعلك تسجل دخولك مباشرة.';
        state.authMode = 'signin';
        render();
      } else {
        await signInWithEmail(email, password);
        state.authBusy = false;
        state.showAuthModal = false;
        render();
      }
    } catch(e){
      state.authBusy = false;
      state.authError = translateAuthError(e.message);
      render();
    }
  });

  return overlay.appendChild(modal), overlay;
}

function translateAuthError(msg){
  if(!msg) return 'صار خطأ غير متوقع.';
  const m = msg.toLowerCase();
  if(m.includes('invalid login credentials')) return 'الإيميل أو الرمز السري غلط.';
  if(m.includes('user already registered')) return 'هذا الإيميل مسجّل مسبقاً، جرب تسجل دخول.';
  if(m.includes('email not confirmed')) return 'لازم تأكد إيميلك أول (تحقق من صندوق بريدك).';
  if(m.includes('password should be at least')) return 'الرمز السري قصير، لازم ٦ أحرف على الأقل.';
  return msg;
}

function awardPoints(teamIdx, topic, q){
  if(teamIdx !== null){
    state.teams[teamIdx].score += q.points;
  }
  q.usedBy = teamIdx;
  state.activeCell = null;
  stopTimer();
  render();
}

/* ---------- timer ---------- */
function startTimer(){
  stopTimer();
  state.timerLeft = state.timerSeconds;
  state.timerHandle = setInterval(()=>{
    state.timerLeft -= 1;
    const disp = document.getElementById('timer-display');
    if(disp){
      disp.textContent = state.timerLeft;
      disp.classList.toggle('warn', state.timerLeft <= 5);
    }
    if(state.timerLeft <= 0){
      stopTimer();
    }
  }, 1000);
}
function stopTimer(){
  if(state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle = null; }
}

/* ============================ END ============================ */
function renderEnd(){
  const [a,b] = state.teams;
  let headline, sub;
  if(a.score === b.score){
    headline = 'تعادل!';
    sub = `${a.name} و${b.name} تعادلوا بـ ${a.score} نقطة`;
  } else {
    const winner = a.score > b.score ? a : b;
    headline = `${winner.name} فاز 🏆`;
    sub = `بفارق ${Math.abs(a.score-b.score)} نقطة`;
  }

  if(state.user && !state.statsRecordedForThisGame){
    state.statsRecordedForThisGame = true;
    recordGameResult(a.score + b.score);
  }

  const wrap = el(`<div class="end-wrap">
    <div class="trophy">🏆</div>
    <h2>${headline}</h2>
    <p>${sub}</p>
    <div class="final-scores">
      <div class="score-card t0"><span class="name">${escapeAttr(a.name)}</span><span class="pts">${a.score}</span></div>
      <div class="score-card t1"><span class="name">${escapeAttr(b.name)}</span><span class="pts">${b.score}</span></div>
    </div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn btn-gold" id="new-round">جولة جديدة — أسئلة جديدة</button>
      <button class="btn btn-ghost" id="replay">إعادة نفس الأسئلة</button>
      <button class="btn btn-ghost" id="new-hub">رجوع للرئيسية</button>
    </div>
  </div>`);

  function resetRoundState(){
    state.pool.forEach(t=>{ t.taken=false; t.takenBy=null; });
    state.selectedTopicIds = [];
    state.turn = 0;
    state.teams[0].score = 0;
    state.teams[1].score = 0;
    state.statsRecordedForThisGame = false;
  }

  wrap.querySelector('#new-round').addEventListener('click', ()=>{
    state.pool.forEach(t=>{
      if(t.bankKey){
        t.questions = pickQuestionsForBankTopic(t.bankKey);
      } else {
        t.questions.forEach(q=>{ q.text=''; q.answer=''; delete q.usedBy; delete q.revealed; });
      }
    });
    resetRoundState();
    goto('select');
  });

  wrap.querySelector('#replay').addEventListener('click', ()=>{
    state.pool.forEach(t=>{
      t.questions.forEach(q=>{ delete q.usedBy; delete q.revealed; });
    });
    resetRoundState();
    goto('select');
  });

  wrap.querySelector('#new-hub').addEventListener('click', ()=> goto('hub'));

  return wrap;
}

/* ============================ WHO AM I? (من أنا؟) ============================ */
async function fetchRandomCharacters(n){
  const { data, error } = await sb
    .from('whoami_characters')
    .select('name')
    .limit(500);
  if(error) throw error;
  const shuffled = data.map(r=>r.name).sort(()=> Math.random()-0.5);
  if(shuffled.length < n) throw new Error('not enough characters');
  return shuffled.slice(0, n);
}

function renderWhoamiSetup(){
  const wrap = el(`<div></div>`);

  const intro = el(`<div class="panel">
    <div class="section-title">من أنا؟</div>
    <div class="section-sub">كل لاعب تنحط له شخصية بالسر — يشوفها كل الحاضرين إلا هو، ويحاول يخمنها بأسئلة نعم/لا. الشخصيات تنجلب أونلاين من قاعدة بيانات، فلازم اتصال إنترنت.</div>
  </div>`);
  wrap.appendChild(intro);

  const countPanel = el(`<div class="panel">
    <div class="section-title" style="font-size:16px;">عدد اللاعبين</div>
    <div style="display:flex; align-items:center; gap:16px; margin-top:10px;">
      <button class="btn btn-ghost btn-sm" id="count-minus">−</button>
      <span class="display" style="font-size:26px; min-width:30px; text-align:center;">${state.whoamiPlayerCount}</span>
      <button class="btn btn-ghost btn-sm" id="count-plus">+</button>
    </div>
  </div>`);
  countPanel.querySelector('#count-minus').addEventListener('click', ()=>{
    if(state.whoamiPlayerCount > 3){ state.whoamiPlayerCount--; render(); }
  });
  countPanel.querySelector('#count-plus').addEventListener('click', ()=>{
    if(state.whoamiPlayerCount < 10){ state.whoamiPlayerCount++; render(); }
  });
  wrap.appendChild(countPanel);

  const namesPanel = el(`<div class="panel">
    <div class="section-title" style="font-size:16px;">أسماء اللاعبين (اختياري)</div>
    <div class="section-sub">لو تركتها فاضية، بنسميهم "اللاعب ١"، "اللاعب ٢"...</div>
    <div id="names-list" style="display:grid; gap:10px;"></div>
  </div>`);
  const namesList = namesPanel.querySelector('#names-list');
  for(let i=0;i<state.whoamiPlayerCount;i++){
    const row = el(`<input type="text" placeholder="اللاعب ${i+1}" value="${escapeAttr(state.whoamiPlayerNames[i]||'')}"/>`);
    row.addEventListener('input', e=>{ state.whoamiPlayerNames[i] = e.target.value; });
    namesList.appendChild(row);
  }
  wrap.appendChild(namesPanel);

  const timerPanel = el(`<div class="panel">
    <div class="section-title" style="font-size:16px;">المؤقت</div>
    <div class="toggle-row">
      <span>تفعيل مؤقت لكل دور</span>
      <div class="switch ${state.whoamiTimerEnabled?'on':''}" id="wa-timer-switch"><div class="knob"></div></div>
    </div>
    <div class="field" style="margin-top:16px; ${state.whoamiTimerEnabled?'':'display:none;'}" id="wa-timer-field">
      <label>مدة كل دور (بالثواني)</label>
      <input type="number" id="wa-timer-seconds" min="10" max="180" value="${state.whoamiTimerSeconds}"/>
    </div>
  </div>`);
  timerPanel.querySelector('#wa-timer-switch').addEventListener('click', ()=>{
    state.whoamiTimerEnabled = !state.whoamiTimerEnabled;
    render();
  });
  const waSec = timerPanel.querySelector('#wa-timer-seconds');
  if(waSec) waSec.addEventListener('input', e=>{
    state.whoamiTimerSeconds = Math.max(5, parseInt(e.target.value||'30',10));
  });
  wrap.appendChild(timerPanel);

  if(state.whoamiError){
    wrap.appendChild(el(`<div class="section-sub" style="color:var(--rose);">${escapeAttr(state.whoamiError)}</div>`));
  }

  const actions = el(`<div class="btn-row">
    <button class="btn btn-gold" id="wa-start" ${state.whoamiLoading?'disabled':''}>${state.whoamiLoading?'...جاري الجلب':'ابدأ التوزيع'}</button>
    <button class="btn btn-ghost" id="wa-back">رجوع</button>
  </div>`);
  actions.querySelector('#wa-back').addEventListener('click', ()=> goto('hub'));
  actions.querySelector('#wa-start').addEventListener('click', async ()=>{
    state.whoamiLoading = true; state.whoamiError=''; render();
    try{
      const names = await fetchRandomCharacters(state.whoamiPlayerCount);
      state.whoamiPlayers = names.map((character, i)=>({
        name: state.whoamiPlayerNames[i]?.trim() || `اللاعب ${i+1}`,
        character,
        guessed: false
      }));
      state.whoamiRevealIndex = 0;
      state.whoamiRevealShown = false;
      state.whoamiTurn = 0;
      state.whoamiFinishOrder = [];
      state.whoamiLoading = false;
      goto('whoami-reveal');
    } catch(e){
      state.whoamiLoading = false;
      state.whoamiError = 'تعذّر جلب الشخصيات — تأكد من اتصال الإنترنت وحاول مرة ثانية.';
      render();
    }
  });
  wrap.appendChild(actions);

  return wrap;
}

function renderWhoamiReveal(){
  const wrap = el(`<div></div>`);
  const idx = state.whoamiRevealIndex;
  const player = state.whoamiPlayers[idx];

  if(!player){
    const done = el(`<div class="panel" style="text-align:center;">
      <div class="section-title">كل الشخصيات اتوزعت ✓</div>
      <div class="section-sub">جاهزين نبدأ اللعب</div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-gold" id="wa-play-start">ابدأ اللعبة</button>
      </div>
    </div>`);
    done.querySelector('#wa-play-start').addEventListener('click', ()=> goto('whoami-play'));
    wrap.appendChild(done);
    return wrap;
  }

  const panel = el(`<div class="panel" style="text-align:center;">
    <div class="section-title">🙈 ${escapeAttr(player.name)} يبعد نظره عن الشاشة</div>
    <div class="section-sub">باقي كل اللاعبين ينطرون ويشوفون — بس مو هو</div>
    ${state.whoamiRevealShown ? `
      <div class="q-points" style="font-size:26px; padding:16px 26px;">${escapeAttr(player.character)}</div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-gold" id="wa-next">التالي</button>
      </div>
    ` : `
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-gold" id="wa-reveal">إظهار الشخصية (لو ${escapeAttr(player.name)} مو ناظر)</button>
      </div>
    `}
  </div>`);

  const revealBtn = panel.querySelector('#wa-reveal');
  if(revealBtn) revealBtn.addEventListener('click', ()=>{ state.whoamiRevealShown = true; render(); });
  const nextBtn = panel.querySelector('#wa-next');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    state.whoamiRevealIndex++;
    state.whoamiRevealShown = false;
    render();
  });

  wrap.appendChild(panel);
  return wrap;
}

function activeWhoamiPlayers(){
  return state.whoamiPlayers.filter(p=>!p.guessed);
}

function renderWhoamiPlay(){
  const wrap = el(`<div></div>`);

  const remaining = activeWhoamiPlayers();
  if(remaining.length === 0){
    goto('whoami-end');
    return wrap;
  }

  if(state.whoamiTurn >= state.whoamiPlayers.length) state.whoamiTurn = 0;
  while(state.whoamiPlayers[state.whoamiTurn].guessed){
    state.whoamiTurn = (state.whoamiTurn + 1) % state.whoamiPlayers.length;
  }
  const player = state.whoamiPlayers[state.whoamiTurn];

  const scoreStrip = el(`<div class="section-sub" style="margin-bottom:14px;">فازوا: ${state.whoamiFinishOrder.map(n=>escapeAttr(n)).join('، ') || '—'}</div>`);
  wrap.appendChild(scoreStrip);

  const panel = el(`<div class="panel" style="text-align:center;">
    <div class="section-title">دور: ${escapeAttr(player.name)}</div>
    <div class="section-sub">يسأل سؤال نعم/لا بصوته، والباقي يردون بصوتهم</div>
    ${state.whoamiTimerEnabled ? `<div class="timer" id="wa-timer-display">${state.whoamiTimerLeft}</div>` : ''}
    <div class="award-row">
      <button class="btn btn-gold btn-sm" id="wa-yes">نعم (استمر)</button>
      <button class="btn btn-sm" style="background:var(--rose); color:#fff;" id="wa-no">لا (الدور التالي)</button>
    </div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn btn-gold" id="wa-correct">خمّنت صح ✅</button>
    </div>
  </div>`);

  panel.querySelector('#wa-yes').addEventListener('click', ()=>{
    if(state.whoamiTimerEnabled) startWhoamiTimer();
    render();
  });
  panel.querySelector('#wa-no').addEventListener('click', ()=>{
    stopWhoamiTimer();
    state.whoamiTurn = (state.whoamiTurn + 1) % state.whoamiPlayers.length;
    render();
  });
  panel.querySelector('#wa-correct').addEventListener('click', ()=>{
    stopWhoamiTimer();
    player.guessed = true;
    state.whoamiFinishOrder.push(player.name);
    const stillLeft = activeWhoamiPlayers();
    if(stillLeft.length === 0){
      goto('whoami-end');
    } else {
      state.whoamiTurn = (state.whoamiTurn + 1) % state.whoamiPlayers.length;
      render();
    }
  });

  wrap.appendChild(panel);
  return wrap;
}

function startWhoamiTimer(){
  stopWhoamiTimer();
  state.whoamiTimerLeft = state.whoamiTimerSeconds;
  state.whoamiTimerHandle = setInterval(()=>{
    state.whoamiTimerLeft -= 1;
    const disp = document.getElementById('wa-timer-display');
    if(disp){
      disp.textContent = state.whoamiTimerLeft;
      disp.classList.toggle('warn', state.whoamiTimerLeft <= 5);
    }
    if(state.whoamiTimerLeft <= 0){ stopWhoamiTimer(); }
  }, 1000);
}
function stopWhoamiTimer(){
  if(state.whoamiTimerHandle){ clearInterval(state.whoamiTimerHandle); state.whoamiTimerHandle = null; }
}

function renderWhoamiEnd(){
  if(state.user && !state.statsRecordedForThisGame){
    state.statsRecordedForThisGame = true;
    recordGameResult(0);
  }

  const wrap = el(`<div class="end-wrap">
    <div class="trophy">🎉</div>
    <h2>انتهت اللعبة</h2>
    <p>ترتيب من خمّن شخصيته أول:</p>
    <div class="panel" style="max-width:400px; margin:0 auto 30px; text-align:right;">
      ${state.whoamiFinishOrder.map((n,i)=>`<div style="padding:8px 0; ${i? 'border-top:1px solid var(--line);':''}">${i+1}. ${escapeAttr(n)}</div>`).join('') || '<div>ما فيه نتائج</div>'}
    </div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn btn-gold" id="wa-new-round">جولة جديدة — شخصيات جديدة</button>
      <button class="btn btn-ghost" id="wa-new-hub">رجوع للرئيسية</button>
    </div>
  </div>`);

  wrap.querySelector('#wa-new-round').addEventListener('click', ()=>{
    state.statsRecordedForThisGame = false;
    goto('whoami-setup');
  });
  wrap.querySelector('#wa-new-hub').addEventListener('click', ()=>{
    state.statsRecordedForThisGame = false;
    goto('hub');
  });

  return wrap;
}

/* ============================ INIT ============================ */
render();
</script>
</body>
</html>
